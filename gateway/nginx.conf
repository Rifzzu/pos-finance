user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format main '$remote_addr - $request_id - [$time_local] "$request" $status $body_bytes_sent "$http_referer"';
  access_log /var/log/nginx/access.log main;

  # Docker embedded DNS so rebuild/restart backend tidak 502 (resolve per request).
  resolver 127.0.0.11 valid=10s;

  # Block any /internal/* access via gateway (must be first).
  # Returns 404 per spec.
  server {
    listen 80;
    server_name _;

    # 404 for any path containing /internal/
    location ~* /internal(/|$) {
      default_type application/json;
      return 404 '{"message":"Not found","code":"NOT_FOUND","errors":null}';
    }

    # Auth: /api/auth/* -> auth:/auth/*
    location /api/auth/ {
      set $auth_upstream auth:8001;
      rewrite ^/api/auth/(.*)$ /auth/$1 break;
      proxy_pass http://$auth_upstream;
      include /etc/nginx/proxy_params;
    }

    # POS: /api/pos/* -> pos:/*
    location /api/pos/ {
      set $pos_upstream pos:8002;
      rewrite ^/api/pos/(.*)$ /$1 break;
      proxy_pass http://$pos_upstream;
      include /etc/nginx/proxy_params;
    }

    # Finance: /api/finance/* -> finance:/*
    location /api/finance/ {
      set $fin_upstream finance:8003;
      rewrite ^/api/finance/(.*)$ /$1 break;
      proxy_pass http://$fin_upstream;
      include /etc/nginx/proxy_params;
    }

    # CORS preflight for dev
    location /api/ {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Request-Id' always;
        add_header Access-Control-Max-Age 86400 always;
        return 204;
      }
      return 404 '{"message":"Not found","code":"NOT_FOUND","errors":null}';
    }

    location / {
      set $fe_upstream frontend:80;
      proxy_pass http://$fe_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
